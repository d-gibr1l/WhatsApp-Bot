version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - API_KEY=your_secret_api_key_here
      - LOG_LEVEL=info
      - RECONNECT_INTERVAL=5000
      - MAX_RECONNECT_RETRIES=5
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
